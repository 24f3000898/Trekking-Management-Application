{% extends "base.html" %}

{% block title %}Login - Trekking Management{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-12 d-flex flex-column align-items-center">
        <!-- Top Banner Link -->
        <div class="w-100 mb-3" style="max-width: 420px;">
            <a href="/" class="text-decoration-none text-muted small fw-semibold d-inline-flex align-items-center gap-1">
                &larr; Back to Home
            </a>
        </div>

        <!-- Clean Compact Auth Card -->
        <div class="card border-0 p-4 w-100" style="max-width: 420px; border-radius: 20px; box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.08); border: 1px solid #e2e8f0; background-color: #ffffff;">
            <div class="card-body p-2">
                <!-- Header -->
                <div class="text-center mb-4">
                    <span class="brand-badge mb-3">TM</span>
                    <h2 class="fw-bold h4 mb-1">Welcome back</h2>
                    <p class="text-secondary small">Enter your credentials to access your account</p>
                </div>

                <!-- Login Form -->
                <form method="post" action="/login">
                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold text-dark mb-1">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required style="border-radius: 10px; padding: 0.75rem 1rem; border-color: #cbd5e1;">
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label small fw-semibold text-dark mb-1">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required style="border-radius: 10px; padding: 0.75rem 1rem; border-color: #cbd5e1;">
                    </div>

                    <button type="submit" class="btn btn-emerald w-100 py-2.5 rounded-3 fw-bold">Sign In</button>
                </form>

                <!-- Footer link -->
                <div class="text-center mt-4">
                    <p class="text-muted small mb-0">
                        Don't have an account? <a href="/register" class="text-emerald fw-semibold text-decoration-none">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
